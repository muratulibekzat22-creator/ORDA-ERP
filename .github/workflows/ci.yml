name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Static quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable
      NEXTAUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run prisma:generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npx prisma validate
      - name: Approved UI and tenant static guard
        run: |
          npm run test:tenant-safety
          npm run test:ui-baseline
      - run: git diff --check
      - run: npm audit --audit-level=high
      - name: Database-free domain checks
        run: |
          npm run test:financial-model
          npm run test:commercial-boundary
          npm run test:order-ux
          npm run test:performance
          npm run test:production:domain

  integration:
    name: Database integration gate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET_TEST }}
      NEXTAUTH_URL: http://127.0.0.1:3219
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Integration gate availability
        id: gate
        shell: bash
        run: |
          if [[ -n "$TEST_DATABASE_URL" && -n "$NEXTAUTH_SECRET" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "codex-tests integration gate enabled"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "codex-tests integration gate skipped: add TEST_DATABASE_URL and NEXTAUTH_SECRET_TEST repository secrets"
          fi
      - if: steps.gate.outputs.enabled == 'true'
        run: npm ci --ignore-scripts
      - if: steps.gate.outputs.enabled == 'true'
        run: npm run prisma:generate
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      - if: steps.gate.outputs.enabled == 'true'
        run: npm run prisma:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      - if: steps.gate.outputs.enabled == 'true'
        run: |
          npm run test:api:security
          npm run test:e2e:business
          npm run test:idempotency
          npm run test:warehouse
          npm run test:production:api
          npm run test:tenant-isolation
          npm run test:order-workflow-final
        env:
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
